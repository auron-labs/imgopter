name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [release-please, desktop]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: build/desktop
          merge-multiple: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            assets: |
              build/linux-amd64/*.tar.gz
              build/linux-amd64/*.deb
          - runner: macos-latest
            platform: darwin/universal
            assets: build/darwin-universal/*.dmg
          - runner: windows-latest
            platform: windows/amd64
            assets: build/windows-amd64/*Setup*.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Package desktop app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: go tool mygo build -platform "$PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.runner }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          compression-level: 0
